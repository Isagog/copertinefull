# Serves ONLY /images/ — the cover JPEGs, read-only off the shared volume.
#
# Ported from the mema3 host vhost (the retired copertine.nginx.conf). Two
# things changed and both matter:
#
#   * `alias /home/mema/...` became `root /srv` + the volume mounted at
#     /srv/images, so the path is a container concern and not host state.
#   * Access-Control-Allow-Origin was pinned to https://dev.isagog.com. It is
#     dropped entirely instead of being repointed: the frontend and the images
#     are now the SAME origin (copertine.ilmanifesto.it, two Traefik routes),
#     so <img> loads are not cross-origin and need no CORS header at all.

server {
    listen 80;
    server_name _;

    # Traefik terminates TLS and is the only thing that can reach this port,
    # so no redirect logic here.
    root /srv;

    access_log /dev/stdout combined;
    error_log  /dev/stderr warn;

    # Container liveness. Kept outside the /images/ location so it answers even
    # if the volume is missing — which is exactly the state where a healthcheck
    # that also proved the volume would mask the real fault behind "unhealthy".
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /images/ {
        autoindex off;

        # Cover images are immutable once written: the filename embeds the
        # edition date and a slug, and a corrected cover is a new filename.
        # A year of browser caching is therefore safe and is what keeps the
        # grid cheap to re-render.
        #
        # NO `expires max;` here. It emits its OWN Cache-Control (max-age=
        # 315360000) alongside this one, and the mema3 vhost carried both —
        # every response went out with two conflicting Cache-Control headers.
        # `add_header` alone is the more specific of the two and the only one
        # that can say `immutable`, so it wins outright.
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        add_header X-Content-Type-Options "nosniff" always;

        # This server is a read surface. Anything that is not a plain read is
        # a bug or an attack, and either way must not reach the volume — which
        # is mounted read-only as a second line of defence.
        limit_except GET HEAD {
            deny all;
        }
    }

    # Nothing else is served from here. Without this, a request that Traefik
    # mis-routed would get nginx's default 404 page and read as a working app.
    location / {
        return 404;
    }
}
